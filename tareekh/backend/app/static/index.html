<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tareekh</title>
<style>
  :root {
    --bg: #f6f2ea; --paper: #fffdf8; --ink: #211d18; --mute: #6f675c; --faint: #a39a8c;
    --line: #e4dccd; --line-2: #d6ccb9;
    --acc: #7c2d23; --acc-ink: #fff8f3; --acc-soft: #f4e4de;
    --ok: #2e6a3f; --ok-soft: #e3efe4; --warn: #8a5a0b; --warn-soft: #f6ebd3; --bad: #a3261b;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --r: 8px;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #1b1916; --paper: #24211d; --ink: #ece6dc; --mute: #a69d90; --faint: #7b7367;
    --line: #37322b; --line-2: #463f36;
    --acc: #d98a7a; --acc-ink: #1b1916; --acc-soft: #3a2723;
    --ok: #8fc79d; --ok-soft: #1f3325; --warn: #e0b25e; --warn-soft: #3a2f1a; --bad: #ef8a7f;
  } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 80px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  /* header */
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  h1 { font: 600 26px/1 var(--serif); margin: 0; color: var(--acc); letter-spacing: .01em; }
  .who { color: var(--mute); font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mute);
          background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--ok); } .dot.busy { background: var(--warn); animation: pulse 1.6s infinite; } .dot.bad { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* tabs */
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  nav button { background: none; border: 0; padding: 10px 14px; color: var(--mute); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--acc); font-weight: 600; }

  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
  [hidden] { display: none !important; }

  /* ask */
  .askbox { display: flex; gap: 8px; }
  .askbox textarea { flex: 1; resize: none; min-height: 48px; max-height: 160px; padding: 12px 14px; border: 1px solid var(--line-2);
                     border-radius: var(--r); background: var(--bg); font-size: 16px; line-height: 1.4; }
  .btn { border: 0; border-radius: var(--r); padding: 10px 18px; background: var(--acc); color: var(--acc-ink); font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }
  .btn.ghost { background: none; color: var(--acc); border: 1px solid var(--line-2); font-weight: 500; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
  .chip { border: 1px solid var(--line-2); background: none; border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--mute); cursor: pointer; }
  .chip:hover { border-color: var(--acc); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc); color: var(--ink); }
  .spacer { flex: 1; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); cursor: pointer; user-select: none; }
  .examples { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
  .examples button { text-align: left; background: none; border: 0; padding: 6px 0; color: var(--mute); cursor: pointer; font-size: 14px; }
  .examples button:hover { color: var(--acc); }
  .examples button::before { content: "→ "; color: var(--faint); }
  .label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }

  .answer { margin-top: 18px; }
  .q { font: 600 17px/1.35 var(--serif); margin: 0 0 10px; }
  .body { font-size: 15.5px; }
  .body p { margin: 0 0 10px; } .body ul { margin: 0 0 10px; padding-left: 20px; } .body li { margin: 3px 0; }
  .body h4 { font: 600 14px var(--sans); margin: 14px 0 6px; color: var(--mute); }
  .ref { display: inline-block; min-width: 18px; padding: 0 4px; margin: 0 1px; border-radius: 4px; background: var(--acc-soft);
         color: var(--acc); font: 600 11.5px/18px var(--sans); text-align: center; vertical-align: 1px; cursor: pointer; border: 0; }
  .meta { font-size: 12.5px; color: var(--faint); margin-top: 6px; }
  .thinking { color: var(--mute); display: flex; align-items: center; gap: 10px; }
  .bar { flex: 0 0 120px; height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; position: relative; }
  .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--acc); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

  .sources { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .src { padding: 10px 12px; border-radius: 6px; margin: 4px -12px; transition: background .4s; }
  .src.flash { background: var(--acc-soft); }
  .src-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
  .src-h b { color: var(--acc); font-weight: 600; }
  .src-h .case { font-weight: 600; }
  .src-h .file { color: var(--faint); font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .src p { margin: 4px 0 0; font-size: 13.5px; color: var(--mute); }

  /* add notes */
  .drop { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 26px 16px; text-align: center; color: var(--mute); cursor: pointer; background: var(--bg); }
  .drop.over { border-color: var(--acc); background: var(--acc-soft); }
  .drop strong { color: var(--ink); }
  .drop small { display: block; margin-top: 4px; color: var(--faint); }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .file-chip { font: 12px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
  .or { text-align: center; color: var(--faint); font-size: 12px; margin: 12px 0; }
  .paste { width: 100%; min-height: 90px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  select, input[type=date] { padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); }

  .steps { display: flex; gap: 6px; margin-top: 16px; font-size: 12.5px; color: var(--faint); flex-wrap: wrap; }
  .steps span { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .steps span.now { color: var(--ink); border-color: var(--warn); background: var(--warn-soft); }
  .steps span.done { color: var(--ok); border-color: transparent; background: var(--ok-soft); }
  .msg { margin-top: 12px; font-size: 14px; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }

  .entry { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-top: 10px; }
  .entry.saved { opacity: .65; }
  .entry.skip { opacity: .45; }
  .entry-h { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .entry-h select { max-width: 260px; }
  .conf { font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .conf.hi { background: var(--ok-soft); color: var(--ok); } .conf.lo { background: var(--warn-soft); color: var(--warn); }
  .entry pre { white-space: pre-wrap; margin: 10px 0 0; font: 13px/1.5 var(--mono); color: var(--mute); max-height: 140px; overflow: auto; }
  .src-file { font: 12px var(--mono); color: var(--faint); }

  @media (max-width: 560px) {
    .askbox { flex-direction: column; } .btn { width: 100%; }
    .entry-h select { max-width: 100%; flex: 1 1 100%; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><h1>Tareekh</h1><span class="who" id="who"></span></div>
    <span class="pill" id="status"><span class="dot"></span><span>connecting…</span></span>
  </header>

  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="ask">Ask</button>
    <button role="tab" aria-selected="false" data-tab="add">Add notes</button>
  </nav>

  <!-- ASK -->
  <section id="tab-ask" class="panel">
    <div class="askbox">
      <textarea id="q" rows="1" placeholder="Ask about any case… e.g. what did Srinivas say about his share?" aria-label="Question"></textarea>
      <button class="btn" id="askBtn">Ask</button>
    </div>
    <div class="opts" id="caseChips" aria-label="Limit to a case">
      <button class="chip" aria-pressed="true" data-case="">All cases</button>
    </div>
    <div class="opts">
      <span class="spacer"></span>
      <label class="toggle" title="One search and a short answer. Untick for a deeper search across cases (slower)."><input type="checkbox" id="quick" checked> Quick answer</label>
    </div>

    <div id="examples" class="examples">
      <p class="label" style="margin-top:6px">Try</p>
      <button>How much of the land does Srinivas say he owns?</button>
      <button>Did Seabreeze do any work on the land before the injunction?</button>
      <button>What does Murthy sir do when the other side keeps asking for time?</button>
      <button>What is pending from our side this week?</button>
    </div>

    <div id="answer" class="answer" hidden></div>
  </section>

  <!-- ADD -->
  <section id="tab-add" class="panel" hidden>
    <label class="drop" id="drop">
      <input type="file" id="files" multiple accept=".jpg,.jpeg,.png,.pdf,.docx,.txt" hidden>
      <strong>Drop photos, scans or files here</strong> or click to choose
      <small>diary pages · order sheets · documents · .txt / .docx / .pdf</small>
    </label>
    <div class="files" id="fileList"></div>
    <div class="or">or paste a note</div>
    <textarea class="paste" id="text" placeholder="12/9 Gorle partition - DW2 absent, Harinath sought time…"></textarea>
    <div class="row">
      <select id="upCase" aria-label="Case"><option value="">Case: work it out from the note</option></select>
      <span class="spacer"></span>
      <button class="btn" id="upBtn">Read it</button>
    </div>
    <div class="steps" id="steps" hidden>
      <span data-s="extracting">Reading</span><span data-s="segmenting">Filing by case</span><span data-s="review">Check</span><span data-s="done">Saved</span>
    </div>
    <div class="msg" id="upMsg"></div>
    <div id="entries"></div>
    <div class="row" id="saveRow" hidden><span class="spacer"></span><button class="btn" id="saveBtn">Save to memory</button></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso + "T00:00:00"); return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
let CASES = {};

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
  return body;
}

// ---------------------------------------------------------------- tabs
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  $("tab-ask").hidden = b.dataset.tab !== "ask";
  $("tab-add").hidden = b.dataset.tab !== "add";
});

// ---------------------------------------------------------------- header
async function refreshStatus() {
  const pill = $("status");
  try {
    const s = await api("/memory/status");
    const busy = (s.pending_operations || 0) + (s.pending_consolidation || 0);
    pill.innerHTML = `<span class="dot ${busy ? "busy" : "ok"}"></span><span>${s.total_documents ?? 0} memories${busy ? ` · learning from ${busy}` : ""}</span>`;
    pill.title = busy ? "Hindsight is still extracting facts and spotting patterns. Answers work; pattern answers improve when this finishes." : "Up to date";
  } catch (e) {
    pill.innerHTML = `<span class="dot bad"></span><span>memory offline</span>`;
    pill.title = e.message;
  }
}
async function loadPractice() {
  try {
    const h = await api("/health");
    const p = h.practice || {};
    if (p.lawyer && p.lawyer !== "the lawyer") $("who").textContent = `Adv. ${p.lawyer}${p.city ? " · " + p.city : ""}`;
  } catch (e) { /* status pill shows it */ }
  try {
    const cases = await api("/cases");
    for (const c of cases) {
      CASES[c.id] = c;
      const chip = document.createElement("button");
      chip.className = "chip"; chip.dataset.case = c.id; chip.setAttribute("aria-pressed", "false");
      chip.textContent = c.short_name; chip.title = `${c.case_number} · ${c.title}`;
      $("caseChips").append(chip);
      $("upCase").add(new Option(`${c.short_name} (${c.case_number})`, c.id));
    }
  } catch (e) { /* ignore */ }
}
$("caseChips").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  document.querySelectorAll("#caseChips .chip").forEach(x => x.setAttribute("aria-pressed", x === b));
};
const caseLabel = id => CASES[id] ? CASES[id].short_name : (id || "");

// ---------------------------------------------------------------- ask
const q = $("q");
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
$("askBtn").onclick = ask;
$("examples").onclick = e => { if (e.target.tagName === "BUTTON") { q.value = e.target.textContent; ask(); } };

// tiny, safe markdown: escape first, then bold / italics / headings / bullets / [n] refs
function md(text) {
  const lines = esc(text).split("\n");
  let html = "", list = false;
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>")
    .replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (_, g) => g.split(/\s*,\s*/).map(n => `<button class="ref" data-n="${n}">${n}</button>`).join(""));
  for (const raw of lines) {
    const l = raw.trim();
    const bullet = l.match(/^[*-]\s+(.*)/);
    if (bullet) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(bullet[1])}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (!l || /^-{3,}$/.test(l)) continue;
    const h = l.match(/^#{1,6}\s+(.*)/);
    html += h ? `<h4>${inline(h[1])}</h4>` : `<p>${inline(l)}</p>`;
  }
  return html + (list ? "</ul>" : "");
}

async function ask() {
  const question = q.value.trim();
  if (!question || $("askBtn").disabled) return;
  const caseId = document.querySelector('#caseChips .chip[aria-pressed="true"]')?.dataset.case || null;
  const quick = $("quick").checked;
  $("askBtn").disabled = true; $("examples").hidden = true;
  const out = $("answer"); out.hidden = false;
  const t0 = Date.now();
  const draw = () => out.innerHTML = `<p class="q">${esc(question)}</p><div class="thinking"><span class="bar"></span>
    Searching memory · ${Math.round((Date.now() - t0) / 1000)} s${quick ? "" : " · deep search takes ~25 s"}</div>`;
  draw(); const tick = setInterval(draw, 1000);
  try {
    const r = await api("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, case_id: caseId, quick }) });
    clearInterval(tick);
    // one source can be filed under several cases (e.g. the sale deed): show it once
    const groups = new Map(), nToGroup = {};
    for (const c of r.citations || []) {
      const key = `${c.source_file || c.type}|${c.hearing_date}`;
      const g = groups.get(key) || { ...c, ns: [], cases: new Set(), id: "src-" + groups.size };
      g.ns.push(c.n); if (c.case_id) g.cases.add(c.case_id); groups.set(key, g); nToGroup[c.n] = g.id;
    }
    const srcs = [...groups.values()].map(g => `
      <div class="src" id="${g.id}">
        <div class="src-h"><b>${g.ns.join(", ")}</b><span class="case">${esc([...g.cases].map(caseLabel).join(" · "))}</span>
          <span>${esc(fmtDate(g.hearing_date))}</span><span class="file">${esc(g.source_file || g.type || "")}</span></div>
        <p>${esc(g.text)}</p>
      </div>`).join("");
    out.innerHTML = `<p class="q">${esc(question)}</p><div class="body">${md(r.answer || "Nothing in memory on that.")}</div>
      <div class="meta">${Math.round((Date.now() - t0) / 1000)} s · ${quick ? "quick answer" : "deep search"}${groups.size ? ` · ${groups.size} source${groups.size > 1 ? "s" : ""}` : ""}</div>
      ${srcs ? `<div class="sources"><p class="label">Sources</p>${srcs}</div>` : ""}`;
    out.querySelectorAll(".ref").forEach(b => b.onclick = () => {
      const el = $(nToGroup[b.dataset.n]); if (!el) return;
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
    });
  } catch (e) {
    clearInterval(tick);
    out.innerHTML = `<p class="q">${esc(question)}</p><p class="msg err">Couldn't answer: ${esc(e.message)}</p>`;
  }
  $("askBtn").disabled = false;
}

// ---------------------------------------------------------------- add notes
const drop = $("drop"), fileInput = $("files");
let picked = [];
const showFiles = () => $("fileList").innerHTML = picked.map(f => `<span class="file-chip">${esc(f.name)}</span>`).join("");
fileInput.onchange = () => { picked = [...fileInput.files]; showFiles(); };
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { picked = [...e.dataTransfer.files]; showFiles(); });

function setStep(status) {
  const order = ["extracting", "segmenting", "review", "done"];
  const at = status === "queued" ? 0 : status === "retaining" ? 3 : order.indexOf(status);
  $("steps").hidden = false;
  $("steps").querySelectorAll("span").forEach((s, i) => s.className = i < at || status === "done" ? "done" : i === at ? "now" : "");
}

let currentUpload = null;
$("upBtn").onclick = async () => {
  const fd = new FormData();
  for (const f of picked) fd.append("files", f);
  if ($("text").value.trim()) fd.append("text", $("text").value.trim());
  if ($("upCase").value) fd.append("case_id", $("upCase").value);
  if (!picked.length && !$("text").value.trim()) { $("upMsg").className = "msg err"; $("upMsg").textContent = "Add a file or paste a note first."; return; }
  $("upBtn").disabled = true; $("entries").innerHTML = ""; $("saveRow").hidden = true; $("upMsg").textContent = "";
  try {
    const { upload_id } = await api("/uploads", { method: "POST", body: fd });
    currentUpload = upload_id;
    await pollUpload(upload_id);
  } catch (e) { $("upMsg").className = "msg err"; $("upMsg").textContent = e.message; }
  $("upBtn").disabled = false;
};

async function pollUpload(id) {
  for (;;) {
    const up = await api(`/uploads/${id}`);
    setStep(up.status);
    if (["queued", "extracting", "segmenting", "retaining"].includes(up.status)) {
      $("upMsg").className = "msg"; $("upMsg").textContent = up.status === "extracting" ? "Reading the handwriting… photos take 10–30 s a page." : "";
      await new Promise(r => setTimeout(r, 1500));
      continue;
    }
    if (up.status === "error") { $("upMsg").className = "msg err"; $("upMsg").textContent = up.error; return; }
    renderEntries(up);
    return;
  }
}

function caseOptions(sel) {
  return `<option value="">— which case? —</option>` + Object.values(CASES).map(c =>
    `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(c.short_name)}</option>`).join("");
}

function renderEntries(up) {
  const saved = up.entries.filter(e => e.status === "retained").length;
  const pending = up.entries.filter(e => !["retained", "rejected"].includes(e.status));
  const m = $("upMsg");
  if (up.status === "done") { m.className = "msg ok"; m.textContent = `Saved ${saved} ${saved === 1 ? "entry" : "entries"} to memory.`; }
  else { m.className = "msg"; m.textContent = `Found ${up.entries.length} ${up.entries.length === 1 ? "entry" : "entries"}. Check the case and date, then save.`; }
  $("entries").innerHTML = up.entries.map(e => {
    const done = e.status === "retained";
    const hi = (e.confidence ?? 0) >= 0.8;
    return `<div class="entry ${done ? "saved" : ""}" data-id="${esc(e.id)}">
      <div class="entry-h">
        <select class="case" ${done ? "disabled" : ""} aria-label="Case">${caseOptions(e.case_id)}</select>
        <input type="date" class="date" value="${esc(e.hearing_date || "")}" ${done ? "disabled" : ""} aria-label="Date">
        ${done ? `<span class="conf hi">saved</span>` : `<span class="conf ${hi ? "hi" : "lo"}" title="${esc(e.reason || "")}">${hi ? "looks right" : "please check"}</span>`}
        <span class="spacer"></span>
        ${done ? "" : `<label class="toggle"><input type="checkbox" class="reject"> skip</label>`}
      </div>
      <div class="src-file">${esc(e.source_file)}</div>
      <pre>${esc(e.text)}</pre>
    </div>`;
  }).join("");
  $("entries").querySelectorAll(".reject").forEach(cb => cb.onchange = () => cb.closest(".entry").classList.toggle("skip", cb.checked));
  $("saveRow").hidden = !pending.length;
}

$("saveBtn").onclick = async () => {
  const edits = [...document.querySelectorAll(".entry")].filter(d => !d.querySelector(".case").disabled).map(d => ({
    id: d.dataset.id,
    case_id: d.querySelector(".case").value || null,
    hearing_date: d.querySelector(".date").value || null,
    reject: d.querySelector(".reject")?.checked || false,
  }));
  $("saveBtn").disabled = true;
  try {
    await api(`/uploads/${currentUpload}/confirm`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ edits }) });
    const up = await api(`/uploads/${currentUpload}`);
    setStep(up.status); renderEntries(up); refreshStatus();
    if (up.status === "done") { picked = []; showFiles(); $("text").value = ""; fileInput.value = ""; }
  } catch (e) { $("upMsg").className = "msg err"; $("upMsg").textContent = e.message; }
  $("saveBtn").disabled = false;
};

loadPractice().then(() => { const pre = new URLSearchParams(location.search).get("q"); if (pre) { q.value = pre; ask(); } });
refreshStatus(); setInterval(refreshStatus, 15000);
</script>
</body>
</html>
